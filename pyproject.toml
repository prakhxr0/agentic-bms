[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoloop"
version = "0.1.0"
description = "LLM-driven HVAC setpoint optimization for EnergyPlus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # EnergyPlus Python API is installed with EnergyPlus, not via pip
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]